; ESP32-S3 N8R8（8MB Flash + 8MB OPI PSRAM）— 主机 serviceProject
; 串口经 CH343（非原生 USB CDC），日志走 UART

[env:esp32-s3-n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8：Quad Flash + OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = colorize
monitor_dtr = 0
monitor_rts = 0

; CH343 UART：不要开 USB CDC，否则 Serial 不走本口
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; 钉死 3.6.0：3.10.x 在 S3 上会回退 GENERIC 阻塞刷灯，易导致 SoftAP 信标发不出去
lib_deps =
    fastled/FastLED@3.6.0
    bblanchon/ArduinoJson@^6.21.3
    olikraus/U8g2@^2.35.0

upload_protocol = esptool
upload_port = /dev/cu.usbmodem5C361519391
monitor_port = /dev/cu.usbmodem5C361519391

; OTA（连上 WiFi 后）
[env:esp32-s3-n8r8-ota]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = colorize

upload_protocol = espota
upload_port = ESP32-S3-LED.local
upload_flags =
    --auth=12345678

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    fastled/FastLED@3.6.0
    bblanchon/ArduinoJson@^6.21.3
    olikraus/U8g2@^2.35.0
