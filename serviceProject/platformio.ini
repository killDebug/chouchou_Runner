[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 串口监控配置
monitor_speed = 115200
monitor_filters = colorize
monitor_dtr = 0
monitor_rts = 0

; 编译选项 - 关键：启用USB CDC模式（ESP32-C3需要这个才能正常使用串口）
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 库依赖
lib_deps = 
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^6.21.3
    olikraus/U8g2@^2.35.0

; USB上传配置
upload_protocol = esptool
upload_port = /dev/cu.usbmodem2301
monitor_port = /dev/cu.usbmodem2301

; 分区表（如果需要更多OTA空间）
board_build.partitions = default.csv

; OTA环境配置（用于OTA上传）
[env:esp32-c3-devkitm-1-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 串口监控配置
monitor_speed = 115200
monitor_filters = colorize

; OTA 上传（通过 mDNS 主机名，与开关一致）
upload_protocol = espota
upload_port = ESP32-C3-LED.local
upload_flags = 
    --auth=12345678

; 编译选项 - 关键：启用USB CDC模式（ESP32-C3需要这个才能正常使用串口）
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 库依赖
lib_deps = 
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^6.21.3
    olikraus/U8g2@^2.35.0

; 分区表（如果需要更多OTA空间）
board_build.partitions = default.csv
