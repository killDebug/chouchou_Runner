; 开关子板 ESP32-C3 Super Mini - 项目配置（参考 serviceProject）
; 仅项目配置与连接（WiFi/OTA），主功能程序后续添加

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 串口监控配置
monitor_speed = 115200
monitor_filters = colorize
monitor_dtr = 0
monitor_rts = 0

; 编译选项 - 关键：启用USB CDC模式（ESP32-C3需要这个才能正常使用串口）
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 库依赖
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    fastled/FastLED@^3.6.0

; USB 上传配置（开关板插上后若端口不同，请修改为实际端口，如 /dev/cu.usbmodem2402）
upload_protocol = esptool
upload_port = /dev/cu.usbmodem2301
monitor_port = /dev/cu.usbmodem2301

; 分区表
board_build.partitions = default.csv

; OTA 环境（开关板连上 WiFi 后，把下面的 IP 改成该设备实际 IP）
[env:esp32-c3-devkitm-1-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = colorize

upload_protocol = espota
; 通过 mDNS 主机名 OTA；若 .local 无法解析，请用 make ota IP=192.168.x.x（设备 IP 见串口「本机 IP」或路由器）
upload_port = ESP32-C3-SwitchA.local
upload_flags = 
    --auth=12345678

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    fastled/FastLED@^3.6.0

board_build.partitions = default.csv
